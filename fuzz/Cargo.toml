[package]
name = "shannon-edge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shannon-edge = { path = ".." }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet_fast"
path = "fuzz_targets/packet_fast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet_v2"
path = "fuzz_targets/packet_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flight"
path = "fuzz_targets/flight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
