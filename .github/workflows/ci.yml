name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    # The golden-stream test runs on all three platforms: a file compressed
    # anywhere must decompress identically everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests (debug, overflow checks on)
        run: cargo test
      - name: Tests (release)
        run: cargo test --release

  cli-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Compress and verify the repository's own files
        run: ./target/release/sedge bench README.md docs/THEORY.md src/model.rs Cargo.lock
      - name: File round-trip through the CLI
        run: |
          ./target/release/sedge compress src/model.rs -o /tmp/model.sedge
          ./target/release/sedge decompress /tmp/model.sedge -o /tmp/model.rs
          cmp src/model.rs /tmp/model.rs

  bindings:
    # The C ABI and the Python binding, on all three platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release
      - name: Python binding tests
        run: python -m unittest discover -s python -v
      - name: C example
        if: runner.os == 'Linux'
        run: |
          cc -Wall -Wextra -Werror examples/c/demo.c -Iinclude -Ltarget/release -lshannon_edge -o demo
          LD_LIBRARY_PATH=target/release ./demo

  fuzz:
    # Coverage-guided fuzzing of every decoder (garbage in: Ok or Err, never
    # a panic, hang or out-of-bounds access) and of losslessness on
    # adversarial inputs. A short smoke run per target; longer campaigns are
    # run locally (fuzz/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s
        run: |
          for t in decompress packet_fast packet_v2 flight roundtrip transform; do
            cargo fuzz run -O "$t" -- -max_total_time=60 -rss_limit_mb=2048 -max_len=4096
          done

  c-port:
    # The portable C99 fast profile: bit-exact with the Rust golden stream,
    # round trips and garbage input under ASan/UBSan, no warnings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C c test
      - run: make -C c warnings
